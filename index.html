<!DOCTYPE html>
<html lang="en">
<head>  
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>DevX · Git Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #14111f;
    --surface: #1f1a30;
    --surface-2: #2a2440;
    --line: #37304f;
    --text: #ece9f5;
    --muted: #9d96bd;
    --amber: #ffb454;
    --main: #58c7e8;
    --feature: #f77fb4;
    --green: #4ade80;
    --red: #fb7185;
    --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --sans: 'Inter', system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }

  body {
    background: var(--ink);
    background-image:
      radial-gradient(60rem 40rem at 80% -10%, rgba(247,127,180,.10), transparent 60%),
      radial-gradient(50rem 40rem at -10% 110%, rgba(88,199,232,.10), transparent 60%);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
    padding: clamp(16px, 4vw, 40px);
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  .app { width: 100%; max-width: 560px; }

  .prompt {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--muted);
    letter-spacing: .02em;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .prompt b { color: var(--amber); font-weight: 700; }
  .blink {
    width: 8px; height: 15px; background: var(--amber); display: inline-block;
    animation: blink 1.1s steps(1) infinite; transform: translateY(2px);
  }
  @keyframes blink { 50% { opacity: 0; } }

  .card {
    background: linear-gradient(180deg, var(--surface), #1a1528);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: clamp(20px, 5vw, 32px);
    box-shadow: 0 30px 60px -30px rgba(0,0,0,.7);
  }

  h1 {
    font-family: var(--mono);
    font-weight: 800;
    font-size: clamp(26px, 7vw, 38px);
    line-height: 1.05;
    margin: 4px 0 10px;
    letter-spacing: -.02em;
  }
  h1 .snack { color: var(--amber); }
  .lede { color: var(--muted); font-size: 16px; line-height: 1.55; margin: 0 0 22px; }

  .meta {
    font-family: var(--mono);
    font-size: 13px;
    border-top: 1px dashed var(--line);
    border-bottom: 1px dashed var(--line);
    padding: 14px 0;
    margin: 0 0 22px;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 6px 16px;
  }
  .meta dt { color: var(--muted); }
  .meta dd { margin: 0; color: var(--text); }

  .field { margin-bottom: 14px; text-align: left; }
  .field label {
    display: block; font-family: var(--mono); font-size: 12px; color: var(--muted);
    letter-spacing: .08em; text-transform: uppercase; margin-bottom: 6px;
  }
  .field input {
    width: 100%; background: #16121f; border: 1px solid var(--line);
    border-radius: 12px; color: var(--text); font-family: var(--sans);
    font-size: 16px; padding: 13px 14px;
  }
  .field input:focus { outline: none; border-color: var(--amber); }
  .err {
    color: var(--red); font-size: 13px; min-height: 18px;
    margin: 0 0 8px; font-family: var(--mono);
  }

  .btn {
    appearance: none; border: 0; cursor: pointer;
    font-family: var(--mono); font-weight: 700; font-size: 16px;
    color: #1a1206; background: var(--amber);
    padding: 15px 22px; border-radius: 14px; width: 100%;
    transition: transform .12s ease, box-shadow .12s ease, opacity .12s;
    box-shadow: 0 10px 24px -10px rgba(255,180,84,.7);
  }
  .btn:hover:not(:disabled) { transform: translateY(-2px); }
  .btn:active:not(:disabled) { transform: translateY(0); }
  .btn:disabled { opacity: .55; cursor: not-allowed; box-shadow: none; }
  .btn.ghost {
    background: transparent; color: var(--text);
    border: 1px solid var(--line); box-shadow: none;
  }

  .step {
    font-family: var(--mono); font-size: 12px; color: var(--muted);
    letter-spacing: .12em; text-transform: uppercase; margin-bottom: 12px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .tag {
    font-family: var(--mono); font-size: 11px; font-weight: 700;
    padding: 3px 9px; border-radius: 999px; letter-spacing: .05em;
  }
  .tag.easy { color: var(--green); background: rgba(74,222,128,.13); }
  .tag.med  { color: var(--amber); background: rgba(255,180,84,.14); }

  .graph {
    background: #16121f; border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; margin-bottom: 14px; overflow-x: auto;
  }
  .graph svg { display: block; width: 100%; height: auto; }

  .cmd {
    font-family: var(--mono); font-size: 14px; line-height: 1.7;
    background: #16121f; border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 20px; white-space: pre; overflow-x: auto;
  }
  .cmd .g { color: var(--amber); }
  .cmd .a { color: var(--main); }

  .q { font-size: 18px; font-weight: 600; margin: 0 0 16px; }
  .q code {
    font-family: var(--mono); background: var(--surface-2);
    padding: 1px 6px; border-radius: 6px; font-size: .85em; color: var(--amber);
  }

  .opts { display: grid; gap: 10px; }
  .opt {
    display: flex; align-items: center; gap: 12px; text-align: left;
    background: var(--surface-2); border: 1px solid var(--line);
    color: var(--text); border-radius: 12px; padding: 14px 16px;
    font-size: 15px; font-family: var(--sans); cursor: pointer;
    transition: border-color .12s, background .12s, transform .08s;
  }
  .opt:hover:not(:disabled) { border-color: var(--muted); }
  .opt:active:not(:disabled) { transform: scale(.99); }
  .opt .key {
    font-family: var(--mono); font-weight: 700; font-size: 13px;
    width: 26px; height: 26px; flex: none; border-radius: 8px;
    display: grid; place-items: center; background: var(--ink); color: var(--muted);
  }
  .opt:disabled { cursor: default; }
  .opt.correct { border-color: var(--green); background: rgba(74,222,128,.12); }
  .opt.correct .key { background: var(--green); color: #062611; }
  .opt.wrong { border-color: var(--red); background: rgba(251,113,133,.12); }
  .opt.wrong .key { background: var(--red); color: #2b0710; }
  .opt.dim { opacity: .45; }

  .explain {
    margin: 16px 0 4px; padding: 14px 16px; border-radius: 12px;
    font-size: 14px; line-height: 1.6; border: 1px solid var(--line);
    background: #16121f; opacity: 0; transform: translateY(6px);
    transition: opacity .25s, transform .25s;
  }
  .explain.show { opacity: 1; transform: none; }
  .explain b { color: var(--amber); }
  .explain code { font-family: var(--mono); color: var(--main); }
  .verdict { font-family: var(--mono); font-weight: 700; margin-bottom: 4px; display: block; }
  .verdict.ok { color: var(--green); }
  .verdict.no { color: var(--red); }

  .foot { margin-top: 20px; }

  .result { text-align: center; }
  .score {
    font-family: var(--mono); font-weight: 800;
    font-size: clamp(48px, 16vw, 76px); line-height: 1; margin: 6px 0 2px;
    color: var(--amber);
  }
  .score small { color: var(--muted); font-size: .35em; font-weight: 500; }
  .result h2 { font-family: var(--mono); font-size: 22px; margin: 12px 0 8px; }
  .result p { color: var(--muted); line-height: 1.6; margin: 0 auto 22px; max-width: 40ch; }

  .snacks {
    font-family: var(--mono); font-size: 14px; color: var(--text);
    border: 1px dashed var(--amber); border-radius: 14px; padding: 16px;
    margin-bottom: 4px; background: rgba(255,180,84,.06);
  }
  .snacks .big { font-size: 17px; font-weight: 700; color: var(--amber); display: block; margin-bottom: 6px; }
  .snacks.info { border: 1px dashed var(--line); background: transparent; color: var(--muted); }

  .sync {
    font-family: var(--mono); font-size: 12px; color: var(--muted);
    margin-top: 14px; min-height: 16px;
  }
  .sync.ok { color: var(--green); }
  .sync.no { color: var(--red); }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 18px 0 16px; }
  .stat {
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 14px; padding: 16px; text-align: center;
  }
  .stat .n { font-family: var(--mono); font-weight: 800; font-size: 32px; color: var(--amber); }
  .stat .l { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .people { display: flex; flex-direction: column; gap: 8px; max-height: 360px; overflow-y: auto; margin: 6px 0 16px; }
  .person {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 14px;
  }
  .person .who { flex: 1; min-width: 0; }
  .person .nm { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .person .em { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .person .marks { font-family: var(--mono); font-size: 13px; flex: none; letter-spacing: 3px; }
  .person .sc { font-family: var(--mono); font-weight: 800; color: var(--amber); font-size: 15px; flex: none; }

  .hidden { display: none !important; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="prompt"><b>devx</b><span>~ $</span><span class="blink"></span></div>

  <!-- INTRO + SIGN-IN -->
  <section id="intro" class="card">
    <h1>Two Git puzzles,<br /><span class="snack">ace both for a Snickers 🍫</span></h1>
    <p class="lede">A quick quiz before Friday's Git &amp; Open Source session. Add your name and email, then read the commit graphs. Get both right and the Snickers is yours.</p>
    <dl class="meta">
      <dt>when</dt><dd>Fri, 29 Aug · 6:00 PM</dd>
      <dt>where</dt><dd>LH101</dd>
    </dl>
    <div class="field">
      <label for="name">Name</label>
      <input id="name" type="text" autocomplete="name" placeholder="Your name" />
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" inputmode="email" placeholder="you@iiitr.ac.in" />
    </div>
    <p class="err" id="entryErr"></p>
    <button class="btn" id="start">Start the quiz →</button>
  </section>

  <section id="quiz" class="card hidden"></section>
  <section id="result" class="card result hidden"></section>
  <section id="admin" class="card hidden"></section>
</div>

<script type="module">
/* ============================================================
   1) FIREBASE — fill this in to capture names/emails and dedupe.
   Firebase console → Project settings → Your apps → SDK config.
   Create the Firestore database in test mode for the event.
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyDmJ81qNnM8pPZYg7nkPdwiaVCmNm-nAJU",
  authDomain: "devx-git-quiz.firebaseapp.com",
  projectId: "devx-git-quiz",
  storageBucket: "devx-git-quiz.firebasestorage.app",
  messagingSenderId: "473391635946",
  appId: "1:473391635946:web:a8320670782784ca6f2693",
  measurementId: "G-94K6CMK2CB"
};
const COLLECTION = "sessionScans";
const ADMIN_PASS = "devX2026"; // change this — gate for the #results view

let db = null;
async function initFirebase() {
  if (!firebaseConfig.projectId) return;
  try {
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    const m = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    const app = initializeApp(firebaseConfig);
    db = { ...m, ref: m.getFirestore(app) };
  } catch (e) { console.warn("Firebase init skipped:", e); }
}

/* ============================================================
   2) QUIZ DATA (both puzzles from the poster)
   ============================================================ */
const graphOne = `
<svg viewBox="0 0 420 96" role="img" aria-label="Linear commit graph A to E, main points at C, feature at E">
  <line x1="46" y1="34" x2="374" y2="34" stroke="#37304f" stroke-width="3"/>
  ${[["A",46],["B",128],["C",210],["D",292],["E",374]].map(([l,x])=>`
    <circle cx="${x}" cy="34" r="9" fill="#16121f" stroke="#58c7e8" stroke-width="3"/>
    <text x="${x}" y="20" fill="#ece9f5" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" text-anchor="middle">${l}</text>`).join("")}
  <text x="374" y="34" dx="18" dy="4" fill="#f77fb4" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">feature</text>
  <path d="M210 48 l0 12" stroke="#58c7e8" stroke-width="2"/>
  <text x="210" y="78" fill="#58c7e8" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" text-anchor="middle">main ↑</text>
</svg>`;

const graphTwo = `
<svg viewBox="0 0 420 128" role="img" aria-label="Diverged commit graph: main A B C F, feature D E branching off B">
  <line x1="46" y1="88" x2="356" y2="88" stroke="#37304f" stroke-width="3"/>
  <path d="M128 88 C 150 88, 168 52, 210 52 L 292 52" fill="none" stroke="#f77fb4" stroke-width="3"/>
  ${[["A",46],["B",128],["C",210],["F",292]].map(([l,x])=>`
    <circle cx="${x}" cy="88" r="9" fill="#16121f" stroke="#58c7e8" stroke-width="3"/>
    <text x="${x}" y="110" fill="#ece9f5" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" text-anchor="middle">${l}</text>`).join("")}
  ${[["D",210],["E",292]].map(([l,x])=>`
    <circle cx="${x}" cy="52" r="9" fill="#16121f" stroke="#f77fb4" stroke-width="3"/>
    <text x="${x}" y="40" fill="#ece9f5" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" text-anchor="middle">${l}</text>`).join("")}
  <text x="356" y="52" dx="0" dy="4" fill="#f77fb4" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">feature</text>
  <text x="356" y="88" dx="0" dy="4" fill="#58c7e8" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">main</text>
</svg>`;

const cmd = `<span class="g">git</span> <span class="a">checkout</span> main
<span class="g">git</span> <span class="a">merge</span> feature`;

const QUESTIONS = [
  {
    tag: "Easy", tagClass: "easy",
    graph: graphOne, cmd,
    q: `Where will <code>HEAD</code> point?`,
    options: [["A","C"],["B","D"],["C","E"],["D","A"]],
    correct: 2,
    ok: "Fast-forward! 🎯",
    no: "Not quite —",
    why: `<code>main</code> is <b>behind</b> <code>feature</code> with no divergence, so Git just <b>fast-forwards</b> <code>main</code> up the line to <b>E</b>. <code>HEAD</code> moves with it — it now points to <b>E</b>.`
  },
  {
    tag: "Medium", tagClass: "med",
    graph: graphTwo, cmd,
    q: `What happens on merge?`,
    options: [["A","Fast-forward"],["B","A new merge commit is created"],["C","Feature branch is deleted"],["D","Merge fails"]],
    correct: 1,
    ok: "Two parents, one commit ✅",
    no: "Close, but —",
    why: `<code>main</code> and <code>feature</code> <b>diverged</b> after <b>B</b> — each has its own commits. Git can't fast-forward, so it builds a <b>new merge commit</b> that joins both histories: a commit with <b>two parents</b>.`
  }
];

/* ============================================================
   3) FLOW
   ============================================================ */
const $ = (id) => document.getElementById(id);
const answers = [];
let idx = 0;
let user = { name: "", email: "" };

const emailOk = (e) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);

$("start").addEventListener("click", startQuiz);
["name","email"].forEach((id) =>
  $(id).addEventListener("keydown", (e) => { if (e.key === "Enter") startQuiz(); }));

async function startQuiz() {
  const name = $("name").value.trim();
  const email = $("email").value.trim().toLowerCase();
  const err = $("entryErr");
  err.textContent = "";

  if (name.length < 2) { err.textContent = "Please enter your name."; $("name").focus(); return; }
  if (!emailOk(email)) { err.textContent = "Please enter a valid email."; $("email").focus(); return; }

  const btn = $("start");
  btn.disabled = true;

  // one submission per email
  if (db) {
    btn.textContent = "Checking…";
    try {
      const q = db.query(db.collection(db.ref, COLLECTION), db.where("email", "==", email));
      const snap = await db.getDocs(q);
      if (!snap.empty) {
        err.textContent = "This email has already played.";
        btn.disabled = false; btn.textContent = "Start the quiz →";
        return;
      }
    } catch (e) { console.warn("dedupe check failed:", e); }
    btn.textContent = "Start the quiz →";
  }

  user = { name, email };
  hide("intro");
  renderQuestion();
}

function renderQuestion() {
  const Q = QUESTIONS[idx];
  const quiz = $("quiz");
  quiz.classList.remove("hidden");
  quiz.innerHTML = `
    <div class="step"><span>Puzzle ${idx + 1} / ${QUESTIONS.length}</span>
      <span class="tag ${Q.tagClass}">${Q.tag}</span></div>
    <div class="graph">${Q.graph}</div>
    <div class="cmd">${Q.cmd}</div>
    <p class="q">${Q.q}</p>
    <div class="opts">
      ${Q.options.map(([k, t], i) => `
        <button class="opt" data-i="${i}"><span class="key">${k}</span><span>${t}</span></button>`).join("")}
    </div>
    <div class="explain" id="explain"></div>
    <div class="foot hidden" id="foot">
      <button class="btn" id="next">${idx === QUESTIONS.length - 1 ? "See your result →" : "Next puzzle →"}</button>
    </div>`;
  quiz.querySelectorAll(".opt").forEach((btn) =>
    btn.addEventListener("click", () => choose(parseInt(btn.dataset.i, 10))));
  scrollTop();
}

function choose(picked) {
  const Q = QUESTIONS[idx];
  const right = Q.correct;
  answers[idx] = picked === right;

  $("quiz").querySelectorAll(".opt").forEach((o, i) => {
    o.disabled = true;
    if (i === right) o.classList.add("correct");
    else if (i === picked) o.classList.add("wrong");
    else o.classList.add("dim");
  });

  const good = picked === right;
  const ex = $("explain");
  ex.innerHTML = `<span class="verdict ${good ? "ok" : "no"}">${good ? Q.ok : Q.no}</span>${Q.why}`;
  ex.classList.add("show");
  $("foot").classList.remove("hidden");
}

$("quiz").addEventListener("click", (e) => {
  if (e.target.id !== "next") return;
  idx++;
  if (idx < QUESTIONS.length) renderQuestion();
  else showResult();
});

function showResult() {
  hide("quiz");
  const score = answers.filter(Boolean).length;
  const bands = {
    2: { h: "Git wizard 🧙", p: "Both nailed — you read commit graphs like a local." },
    1: { h: "Halfway there", p: "One down, one to go. Friday fills in the rest." },
    0: { h: "This session's for you 😄", p: "That's exactly what Friday is for — come learn it hands-on." }
  };
  const b = bands[score];
  const reward = score === 2
    ? `<div class="snacks">
        <span class="big">🍫 A Snickers is yours</span>
        Perfect score! Claim it at the session — Fri, 29 Aug · 6:00 PM · LH101.
      </div>`
    : `<div class="snacks info">
        Fri, 29 Aug · 6:00 PM · LH101 — come along and level up.
      </div>`;
  const r = $("result");
  r.classList.remove("hidden");
  r.innerHTML = `
    <div class="step" style="justify-content:center">your score</div>
    <div class="score">${score}<small>/2</small></div>
    <h2>${b.h}</h2>
    <p>${b.p}</p>
    ${reward}
    <div class="sync" id="sync"></div>`;
  scrollTop();
  recordScan(score);
}

async function recordScan(score) {
  const sync = $("sync");
  if (!db) { sync.textContent = ""; return; }
  try {
    await db.addDoc(db.collection(db.ref, COLLECTION), {
      name: user.name,
      email: user.email,
      score,
      q1: !!answers[0],
      q2: !!answers[1],
      ts: db.serverTimestamp()
    });
    sync.textContent = "✓ you're on the list — see you Friday";
    sync.classList.add("ok");
  } catch (e) {
    console.warn(e);
    sync.textContent = "Couldn't save — please tell an organiser.";
    sync.classList.add("no");
  }
}

/* ============================================================
   4) ORGANISER VIEW — open the same URL with #results
   ============================================================ */
function esc(s) { return String(s || "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }

async function showAdmin() {
  ["intro","quiz","result"].forEach(hide);
  const a = $("admin");
  a.classList.remove("hidden");
  a.innerHTML = `<div class="step"><span>Organiser view</span></div>
    <p class="q" style="margin-bottom:14px">Who's played</p>
    <div id="adminBody"><p style="color:var(--muted)">Loading…</p></div>`;

  const pass = prompt("Enter organiser passcode:");
  if (pass !== ADMIN_PASS) { $("adminBody").innerHTML = `<p style="color:var(--red)">Wrong passcode.</p>`; return; }
  if (!db) { $("adminBody").innerHTML = `<p style="color:var(--muted)">Add your Firebase config in the file to see live results.</p>`; return; }

  try {
    const snap = await db.getDocs(db.collection(db.ref, COLLECTION));
    const rows = [];
    let sum = 0;
    snap.forEach((d) => { const v = d.data(); rows.push(v); sum += (v.score || 0); });
    rows.sort((x, y) => (y.ts?.seconds || 0) - (x.ts?.seconds || 0));
    const total = rows.length;
    const avg = total ? (sum / total).toFixed(1) : "0";

    const list = rows.map((v) => `
      <div class="person">
        <div class="who">
          <div class="nm">${esc(v.name) || "—"}</div>
          <div class="em">${esc(v.email)}</div>
        </div>
        <div class="marks">${v.q1 ? "✅" : "❌"}${v.q2 ? "✅" : "❌"}</div>
        <div class="sc">${v.score ?? 0}/2</div>
      </div>`).join("");

    $("adminBody").innerHTML = `
      <div class="stats">
        <div class="stat"><div class="n">${total}</div><div class="l">signed up (headcount)</div></div>
        <div class="stat"><div class="n">${avg}<small style="font-size:.4em;color:var(--muted)"> /2</small></div><div class="l">average score</div></div>
      </div>
      <div class="people">${list || '<p style="color:var(--muted)">No entries yet.</p>'}</div>
      <button class="btn ghost" onclick="location.reload()">Refresh</button>`;
  } catch (e) {
    $("adminBody").innerHTML = `<p style="color:var(--red)">Couldn't read results: ${esc(e.message)}</p>`;
  }
}

/* ---- boot ---- */
function hide(id) { $(id).classList.add("hidden"); }
function scrollTop() { window.scrollTo({ top: 0, behavior: "smooth" }); }

await initFirebase();
if (location.hash.replace("#","").toLowerCase() === "results") showAdmin();
</script>
</body>
</html>
